name: DIRS paper reproducibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "analysis/**"
      - "scripts/**"
      - "tests/**"
      - "calculations/**"
      - "reference/**"
      - "pyproject.toml"
      - "requirements-reproduction.txt"
      - ".github/workflows/reproduce-paper.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-reproduction.txt
      - name: Install pinned scientific runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-reproduction.txt
          python -m pip install --no-deps -e .
      - name: Test implementation and independent paper reproduction
        run: python -m pytest -q
      - name: Recalculate published values from source Hessians
        run: python scripts/reproduce_publication.py --verify-raw
      - name: Implementation-independent recomputation from raw ORCA .hess
        run: python scripts/independent_check.py
      - name: Non-invasive HCN near-linearity sensitivity audit
        run: python scripts/hcn_rank_sensitivity.py
      - name: Archive numerical reproduction proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dirs-paper-reproduction
          path: |
            reproduced/reproduction_report.json
            reproduced/primary_37_recomputed.csv
            reproduced/water_hexamer_6_recomputed.csv
            reproduced/functional_controls_recomputed.csv
            reproduced/independent_check/
            reproduced/hcn_rank_sensitivity.json
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish versioned software release
    needs: reproduce
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish tag and release for the package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tag="v$version"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer main commit exists; release the latest revision instead."
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; leaving the published version unchanged."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "DIRS $tag" \
            --notes "DIRS source code, optimized-geometry Hessians, input files, coordinate definitions, and numerical verification tools for the accompanying JPCL manuscript. Run the instructions in README.md to reproduce the reported compliance constants and response descriptors."
